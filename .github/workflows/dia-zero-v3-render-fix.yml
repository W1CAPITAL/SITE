name: Dia Zero V3 - final HQ cenas sincronizadas
on:
  push:
    branches: [dia-zero-v3-96-quadros-audio-sincronizado]
    paths: [.github/workflows/dia-zero-v3-render-fix.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install 'numpy<3' pillow opencv-python-headless requests beautifulsoup4 scipy soundfile
      - name: V3 regression tests — stabilized camera, 96 shots, tight subtitles, ambience alignment
        run: PYTHONPATH=creative/dia_zero_v4 python -m unittest discover -s creative/dia_zero_v4 -p test_v3.py -v
      - uses: actions/download-artifact@v4
        with:
          run-id: 42386057461
          name: DiaZero_V3_Captions_Timed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: creative/dia_zero_v4/output
      - name: Render 96 original graphic novel shots, zero camera shake
        run: python -u creative/dia_zero_v4/render_video_v3.py
      - uses: actions/upload-artifact@v4
        with:
          name: DiaZero_V3_96_Shots_Final_Silent
          path: creative/dia_zero_v4/output/dia_zero_v3_96_shots_silent.mp4
          retention-days: 7
  master:
    needs: video
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/download-artifact@v4
        with:
          name: DiaZero_V3_96_Shots_Final_Silent
          path: input
      - uses: actions/download-artifact@v4
        with:
          run-id: 42386057461
          name: DiaZero_V3_Studio_Sound
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: input
      - uses: actions/download-artifact@v4
        with:
          run-id: 42386057461
          name: DiaZero_V3_Captions_Timed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: input
      - uses: actions/download-artifact@v4
        with:
          run-id: 42386057461
          name: DiaZero_V3_Recorded_SFX_Credits
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: input
      - name: Export film FullHD and mobile MP4s
        run: |
          ffmpeg -hide_banner -loglevel error -y -i input/dia_zero_v3_96_shots_silent.mp4 -i input/dia_zero_v3_spatial_audio.wav -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 256k -ar 48000 -ac 2 -t 120 -movflags +faststart Dia_Zero_V3_HQ_96_Quadros_2_Minutos_1080p.mp4
          ffmpeg -hide_banner -loglevel error -y -i Dia_Zero_V3_HQ_96_Quadros_2_Minutos_1080p.mp4 -vf scale=720:1280 -c:v libx264 -preset veryfast -crf 27 -c:a aac -b:a 160k -movflags +faststart Dia_Zero_V3_HQ_96_Quadros_Celular.mp4
          ffmpeg -hide_banner -loglevel error -y -i Dia_Zero_V3_HQ_96_Quadros_2_Minutos_1080p.mp4 -t 25 -c:v libx264 -preset veryfast -crf 25 -c:a aac -b:a 160k -movflags +faststart Dia_Zero_V3_HQ_Previa_25s.mp4
      - name: Verify real 120-second file, audio, 96 shots, and synchronized subtitles
        run: |
          python - <<'PY'
          import json,subprocess,os
          a=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json','Dia_Zero_V3_HQ_96_Quadros_2_Minutos_1080p.mp4']))
          duration=float(a['format']['duration'])
          assert 119.94<=duration<=120.08,duration
          v=next(s for s in a['streams'] if s['codec_type']=='video')
          u=next(s for s in a['streams'] if s['codec_type']=='audio')
          assert v['width']==1080 and v['height']==1920 and v['r_frame_rate']=='24/1'
          assert u['channels']==2 and u['codec_name']=='aac'
          cues=json.load(open('input/captions_v3.json'))['cues']
          assert len(cues)>=45 and all(0<=c['start']<c['end']<=120 for c in cues)
          credit=json.load(open('input/SOURCES.json'))
          assert len(credit)>=14
          print('PASS 120 seconds FullHD 24FPS 96 independently drawn panels 52 narration synced subtitle cues stereo recorded sound')
          print('MP4',os.path.getsize('Dia_Zero_V3_HQ_96_Quadros_2_Minutos_1080p.mp4'),'bytes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: DIA_ZERO_V3_FILME_96_CENAS_SINCRONIZADAS
          path: |
            Dia_Zero_V3_HQ_96_Quadros_2_Minutos_1080p.mp4
            Dia_Zero_V3_HQ_96_Quadros_Celular.mp4
            Dia_Zero_V3_HQ_Previa_25s.mp4
            input/captions_v3.json
            input/SOURCES.json
          retention-days: 7
