name: Dia Zero V3 - TDD regression proof
on:
  push:
    branches: [dia-zero-v3-96-quadros-audio-sincronizado]
    paths: [.github/workflows/dia-zero-v3-tests-red.yml]
permissions: {contents: read}
jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install pillow numpy scipy soundfile requests beautifulsoup4
      - run: PYTHONPATH=creative/dia_zero_v4 python -m unittest discover -s creative/dia_zero_v4 -p test_v3.py -v
