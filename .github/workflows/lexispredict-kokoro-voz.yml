name: LexisPredict male PT-BR voice (Kokoro)
on:
  push:
    branches:
      - lexispredict-kokoro-voz-20261107
    paths:
      - .github/workflows/lexispredict-kokoro-voz.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voiceover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install open-source speech dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python -m pip install --upgrade pip
          python -m pip install 'kokoro>=0.9.4' soundfile numpy
      - name: Render Brazilian Portuguese male voiceover
        run: python marketing/lexispredict/gerar_narracao_kokoro.py
      - name: Save voiceovers for the video editor
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lexispredict-narracoes-masculinas-ptbr
          path: generated-voices/*
          if-no-files-found: warn
          retention-days: 3
