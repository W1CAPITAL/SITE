name: Davi portfolio checks
on:
  push:
    branches: [main]
    paths:
      - 'portfolio/**'
      - 'index.html'
      - '.github/workflows/davi-portfolio.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate pages, original CV and W1 integration
        run: node --test portfolio/site.test.mjs
