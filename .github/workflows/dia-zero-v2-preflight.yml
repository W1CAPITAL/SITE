name: Dia Zero V2 - testes iniciais e fontes de audio
on:
  push:
    branches: [dia-zero-hq-audio-movimento-v2-20261107]
    paths: [.github/workflows/dia-zero-v2-preflight.yml]
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install numpy pillow requests beautifulsoup4
      - name: Confirm tests reproduce current problems
        continue-on-error: true
        run: PYTHONPATH=creative/dia_zero_v4 python -m unittest discover -s creative/dia_zero_v4 -p test_v2.py -v
      - name: Inspect source for licensed real sound effects
        run: |
          python - <<'PY'
          import requests,re,html
          url='https://mixkit.co/free-sound-effects/rain/'
          r=requests.get(url,timeout=35,headers={'User-Agent':'Mozilla/5.0'})
          print('status',r.status_code,'bytes',len(r.content))
          s=r.text
          for pattern in [r'https?[^\s\\"\']+?\.mp3',r'assets\.mixkit[^\s\\"\']+',r'.{0,200}Long rain ambience.{0,800}',r'.{0,100}preview.{0,200}',r'.{0,80}active_storage.{0,180}']:
              try:
                  vals=re.findall(pattern,s,flags=re.I|re.S)
                  print('PATTERN',pattern,'COUNT',len(vals))
                  for v in vals[:5]:print(html.unescape(v)[:700])
              except Exception as e:print(e)
          PY
