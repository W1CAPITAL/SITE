name: W1 Reel Studio checks
on:
  pull_request:
    paths:
      - 'scripts/reel-studio/**'
      - 'scripts/creative-lab/**'
      - '.github/workflows/w1-reel-studio.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/reel-studio/**'
      - 'scripts/creative-lab/**'
      - '.github/workflows/w1-reel-studio.yml'
permissions:
  contents: read
jobs:
  node-and-render-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install media tools used by the smoke test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -hide_banner -encoders | grep libx264
          ffmpeg -hide_banner -filters | grep ' ass '
      - name: Validate private-worker catalog and bootstrap syntax
        run: |
          bash -n scripts/creative-lab/install-private.sh
          node --check scripts/creative-lab/registry.mjs
          node --test scripts/creative-lab/registry.test.mjs
      - name: Check JS syntax
        run: node --check scripts/reel-studio/studio.mjs
      - name: Test data validation, licensing, voice API and FFmpeg render
        run: |
          bash -n scripts/reel-studio/w1-robo-voice.sh
          node --test scripts/reel-studio/*.test.mjs
