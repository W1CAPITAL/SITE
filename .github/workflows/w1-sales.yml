name: W1 Capital site quality

on:
  pull_request:
    paths:
      - 'index.html'
      - 'sites/**'
      - 'projetos/**'
      - 'portfolio/**'
      - 'scripts/ai-lab/**'
      - 'creative/reels/**'
      - 'guia/**'
      - 'operacao/**'
      - 'parcerias/**'
      - 'explorar/**'
      - 'exemplo-relatorio/**'
      - 'diagnostico/**'
      - 'robots.txt'
      - 'sitemap.xml'
      - '04419ef1947dc3671fc73417dced60f5.txt'
      - '.github/workflows/w1-indexnow.yml'
      - 'README.md'
      - 'docs/**'
      - 'sales/**'
      - 'lexispredict/**'
      - 'assets/**'
      - '.github/workflows/w1-sales.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sites/**'
      - 'lexispredict/**'
      - 'assets/**'
      - 'README.md'
      - 'docs/**'
      - 'sales/**'
      - '.github/workflows/w1-sales.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-site:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check projetos/plan-core.mjs
          node --check projetos/app.mjs
          node --check sales/core.js
          node --check sales/app.js
          node --check sales/premium.js
          node --check sales/motion-experience.mjs
          node --check sales/config.js
          node --check sales/prospecting/fichario.js
          node --check sales/prospecting/workspace.js
          node --check sales/seo/audit.mjs
          node --check sales/seo/indexnow.mjs
          node --check guia/origem.mjs
          node --check diagnostico/diagnostico.mjs
          node --check sales/operations/meeting-notes.js
          node --check sales/media/spot-preview.js
          node --check sales/operations/commercial-core.js
          node --check sales/operations/commercial.js
          node --check sales/offers/lexispredict-unit-economics.mjs
          node --check lexispredict/vendas.js
          node --check sites/brief.js
          node --check sales/interactive-demo-model.mjs
          node --check sales/interactive-demo.mjs
      - name: Validate homepage, consultation and privacy
        run: node --test portfolio/site.test.mjs projetos/plan-core.test.mjs projetos/page.test.mjs sales/motion-experience.test.mjs sales/seo/navigation-discovery.test.mjs sales/seo/b2b-carousel.test.mjs sales/seo/indexnow.test.mjs sales/seo/partners.test.mjs sales/seo/sample-report.test.mjs sales/seo/portfolio-contact.test.mjs sales/seo/portfolio-service.test.mjs sales/seo/bookings.test.mjs diagnostico/diagnostico.test.mjs sales/seo/organic-growth.test.mjs sales/official-mini-preview.test.mjs sales/vector-logos.test.mjs sales/interactive-demo.test.mjs sales/brand-assets.test.mjs sales/conversion-redesign.test.mjs sales/reference-layout.test.mjs sales/live-site-regressions.test.mjs sales/core.test.mjs sales/site.test.mjs sales/prospecting/fichario.test.mjs sales/seo/audit.test.mjs sales/operations/meeting-notes.test.mjs sales/media/spot-preview.test.mjs sales/operations/commercial.test.mjs sales/offers/lexispredict-unit-economics.test.mjs lexispredict/vendas.test.mjs lexispredict/mobile-menu.test.mjs
