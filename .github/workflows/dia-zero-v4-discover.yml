name: Dia Zero V4 inspect Foley recordings
on:
  push:
    branches: [dia-zero-v4-narrativa-coerente-20261107]
    paths: [.github/workflows/dia-zero-v4-discover.yml]
permissions: {contents: read}
jobs:
  sound-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install requests beautifulsoup4 numpy pillow opencv-python-headless scipy soundfile
      - run: PYTHONPATH=creative/dia_zero_v4 python -m unittest discover -s creative/dia_zero_v4 -p test_v4.py -v || true
      - run: python -u creative/dia_zero_v4/sound_catalog_v4.py
