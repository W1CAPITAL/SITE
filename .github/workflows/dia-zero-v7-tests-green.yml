name: DIA ZERO V7 - test real object movement (GREEN)
on:
  push:
    branches: [dia-zero-v7-objetos-personagens-animados-20261107]
    paths: [.github/workflows/dia-zero-v7-tests-green.yml]
permissions: {contents: read}
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install 'numpy<3' opencv-python-headless pillow requests
      - name: All object animation tests including 12 previously static scenes
        run: PYTHONPATH=creative/dia_zero_v7:creative/dia_zero_v4 python -m unittest discover -s creative/dia_zero_v7 -p test_v7.py -v
