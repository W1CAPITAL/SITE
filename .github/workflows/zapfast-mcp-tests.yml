name: ZapFast MCP tests

on:
  pull_request:
    paths:
      - "zapfast-mcp/**"
      - ".github/workflows/zapfast-mcp-tests.yml"
  push:
    branches: [main]
    paths:
      - "zapfast-mcp/**"
      - ".github/workflows/zapfast-mcp-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        working-directory: zapfast-mcp
        run: npm test
