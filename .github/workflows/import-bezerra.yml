name: Bezerra Menezes visual concept assets
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-bezerra.yml
      - scripts/import_bezerra_visuals.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-concept-images:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image processor
        run: python -m pip install Pillow
      - name: Import and crop original six concept illustrations
        run: python scripts/import_bezerra_visuals.py
      - name: Save permanent local images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sites/demo-bezerra-menezes/assets/*.webp
          git diff --cached --quiet && exit 0
          git commit -m "assets: Bezerra Menezes six original visual references and supporting crops [skip ci]"
          git push origin HEAD:main
